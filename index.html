<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0e2a6b"><title>Hanukkah Gift Exchange</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%95%8E%3C/text%3E%3C/svg%3E"><style>:root{--navy:#081a44;--navy2:#0e2a6b;--blue:#1f55d6;--sky:#5d8cff;--gold:#f0c24b;--gold2:#c9952a;--cream:#fff8e6;--ink:#0b1430;--card:#ffffff;--muted:#5b6788}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 50% -200px,#2a4fb0 0%,var(--navy2) 40%,var(--navy) 100%) fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#ffe9a6aa 50%,transparent 51%),radial-gradient(1px 1px at 35% 75%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 55% 45%,#fff5 50%,transparent 51%);opacity:.7}
a{color:var(--blue)}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 80px;position:relative}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;padding:6px 2px 12px}
header.top a.brand{color:#fff;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
header.top nav a{color:#ffe7a3;text-decoration:none;font-weight:600;font-size:14px;margin-left:12px}
.hero{color:#fff;text-align:center;padding:10px 4px 18px}
.hero h1{font-size:30px;line-height:1.15;margin:8px 0 6px}
.hero p{color:#d8e2ff;margin:0 auto;max-width:520px}
.gold{color:var(--gold)}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 10px 30px #0004;margin:14px 0}
.card h2{margin:0 0 8px;font-size:20px}
.card h3{margin:14px 0 6px;font-size:16px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;background:var(--blue);color:#fff;min-height:48px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(180deg,#ffd970,var(--gold) 55%,var(--gold2));color:#2a1d00;box-shadow:0 4px 0 #9a6f16}
.btn.ghost{background:#eef3ff;color:var(--navy2)}
.btn.danger{background:#fde8e8;color:#9b1c1c}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #cdd6ee;border-radius:12px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);border-color:var(--sky)}
label{font-weight:600;font-size:14px;display:block;margin:10px 0 4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#eef3ff;color:var(--navy2);font-weight:600;font-size:14px;border:0;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--navy2);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f7}
.list li:last-child{border-bottom:0}
.tag{font-size:12px;font-weight:700;border-radius:8px;padding:3px 7px;background:#fff3cf;color:#7a5600}
.tag.blue{background:#e5edff;color:#173c9c}
.status{font-size:13px;color:var(--muted);min-height:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#111a33;color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer.foot{color:#c9d4f5;text-align:center;font-size:13px;margin-top:30px}
footer.foot a{color:#ffe7a3}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.gift{background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px #0003;display:flex;flex-direction:column;gap:6px}
.gift .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gift .name{font-weight:800;font-size:16px;line-height:1.25}
.gift .price{font-weight:800;color:#0c7a3e;white-space:nowrap}
.gift .why{font-size:14px;color:#33405f}
.gift .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gift a.go{margin-top:4px}
.count{color:#d8e2ff;font-size:14px;margin:6px 2px}
/* wishlist */
.wish{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #edf0f7}
.wish:last-child{border-bottom:0}
.wish .body{flex:1;min-width:0}
.wish .t{font-weight:700;word-wrap:break-word}
.wish .sub{font-size:13px;color:var(--muted);word-break:break-all}
.wish input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--blue)}
.edit-item{border:1.5px dashed #cdd6ee;border-radius:14px;padding:10px;margin:10px 0;background:#fafcff}
.edit-item .row input{flex:1}
/* reveal */
.reveal-stage{position:relative;text-align:center;color:#fff;padding:6px 0 4px}
.scene{width:300px;height:330px;margin:0 auto;perspective:1000px;perspective-origin:50% 35%;position:relative}
.wob{position:absolute;left:50%;top:40px;width:0;height:0;transform-style:preserve-3d;transform-origin:0 230px}
.dreidel{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
.dreidel .face{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid #f6d36b;border-left-width:1px;border-right-width:1px;background:linear-gradient(180deg,#2f6bff 0%,#1645c4 55%,#0f328f 100%);padding:4px;line-height:1.05;text-shadow:0 1px 2px #0008}
.dreidel .face span{display:block;word-break:break-word}
.dreidel .face.target{background:linear-gradient(180deg,#ffe48a,#f0c24b 50%,#c9952a);color:#2a1d00;text-shadow:none}
.dreidel .tri{position:absolute;left:0;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(180deg,#1645c4,#0b2770);clip-path:polygon(0 0,100% 0,50% 100%)}
.dreidel .cap{position:absolute;left:0;top:0;background:radial-gradient(circle,#ffe48a,#d9a634 70%);}
.dreidel .stem{position:absolute;left:0;top:0;background:linear-gradient(90deg,#b8841f,#ffe48a 50%,#b8841f);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.dreidel .knob{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#e2b13c 60%,#9a6f16)}
.shadow{position:absolute;left:50%;top:290px;width:170px;height:26px;margin-left:-85px;border-radius:50%;background:radial-gradient(ellipse,#0009,#0000 70%);}
.pointer{position:absolute;left:50%;top:6px;transform:translateX(-50%);color:var(--gold);font-size:22px;filter:drop-shadow(0 2px 2px #0008)}
.result{opacity:0;transform:translateY(16px) scale(.96);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.9,.3,1.3)}
.result.show{opacity:1;transform:none}
.big-name{font-size:40px;font-weight:900;line-height:1.05;margin:6px 0;background:linear-gradient(180deg,#fff5cc,#f0c24b 60%,#c9952a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px #0008)}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:50;will-change:transform,opacity}
.menorah{display:block;margin:0 auto}
.flame{animation:flick 1.6s ease-in-out infinite alternate;transform-origin:50% 100%}
.flame:nth-child(2n){animation-delay:-.6s}
@keyframes flick{0%{transform:scaleY(1) rotate(-2deg);opacity:.9}100%{transform:scaleY(1.15) rotate(2deg);opacity:1}}
.linkrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f7}
.linkrow:last-child{border-bottom:0}
.linkrow .nm{font-weight:700;flex:1;min-width:0}
.match{font-weight:700}
.hidden{display:none!important}
.tabs{display:flex;gap:6px;background:#ffffff22;padding:5px;border-radius:14px;margin:6px 0 4px}
.tabs button{flex:1;border:0;background:transparent;color:#fff;font-weight:700;padding:10px;border-radius:10px;font-size:15px}
.tabs button.on{background:#fff;color:var(--navy2)}
@media (prefers-reduced-motion: reduce){.flame{animation:none}.result{transition:opacity .3s}}
.dstage{position:relative;width:100%;max-width:440px;height:min(118vw,520px);margin:4px auto 0;border-radius:24px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
background:radial-gradient(circle at 18% 22%,#7fb0ff55 0 7%,transparent 8%),radial-gradient(circle at 82% 16%,#a9c8ff44 0 9%,transparent 10%),radial-gradient(circle at 70% 58%,#5f8fff33 0 6%,transparent 7%),radial-gradient(circle at 12% 70%,#8fb6ff33 0 10%,transparent 11%),radial-gradient(circle at 50% 30%,#2c63ff 0%,#123a9e 45%,#06184d 100%);box-shadow:inset 0 0 60px #000a,0 12px 30px #0006}
.dstage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.dhint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 6px #000;pointer-events:none;animation:hint 1.8s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateX(-12px);opacity:.75}50%{transform:translateX(12px);opacity:1}}
.mutebtn{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:3}
.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
.whoa{display:inline-block;background:#ffffff1f;border:1px solid #ffe7a366;color:#ffe7a3;font-weight:800;border-radius:999px;padding:6px 12px;margin:4px 0 8px}
@media (prefers-reduced-motion: reduce){.dhint{animation:none}}
/* ---- v2: accounts, wishlists, photos ---- */
.center{text-align:center}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:#0b1d4dee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid #ffffff22;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;color:#c9d4f5;text-decoration:none;font-size:11px;padding:4px 2px;border-radius:12px;max-width:110px;min-width:0}
.tabbar a span{font-size:21px;line-height:1.1}
.tabbar a b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar a.on{color:#ffe7a3;background:#ffffff14}
.err{color:#b42318;font-weight:600;min-height:20px;font-size:14px;margin-top:10px}
.remrow{display:flex!important;gap:8px;align-items:center;font-weight:500!important;color:#33405f;margin:12px 0!important}
.remrow input{width:20px;height:20px;accent-color:var(--blue)}
.wrapchips{flex-wrap:wrap;overflow:visible}
.back{display:inline-block;color:#ffe7a3;text-decoration:none;font-weight:700;margin:0 0 6px}
.tag.green{background:#dcfce7;color:#14532d}
.linkbtn{border:0;background:none;color:var(--blue);font:inherit;font-size:13px;font-weight:600;padding:4px 0;cursor:pointer}
.linkbtn.danger{color:#9b1c1c}
.ph{position:relative;flex:none;width:56px;height:56px;border-radius:12px;background:#f3f6fd;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid #e3e9f7}
.ph .phi{width:58%;height:58%;display:block;opacity:.9}.ph .phi svg{width:100%;height:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;opacity:0;transition:opacity .25s}
.ph img.in{opacity:1}
.ph.tiny{width:40px;height:40px;border-radius:9px}
.ph.big{width:84px;height:84px;border-radius:14px}
.ph.gimg{width:100%;height:auto;aspect-ratio:4/3;border-radius:12px}
.wl{padding:6px 12px}
.wlrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #edf0f7;color:inherit;text-decoration:none}
.wlrow:last-child{border-bottom:0}
.wlrow .av{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#2f6bff,#1645c4);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px}
.wlrow .nm{font-weight:800}
.wlrow .thumbs{display:flex;gap:4px;flex:none}
.wlrow .chev{color:#9aa6c4;font-size:26px;line-height:1;flex:none}
@media(max-width:360px){.wlrow .thumbs .ph:nth-child(3){display:none}}
.witem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #edf0f7}
.witem:last-child{border-bottom:0}
.witem .body{flex:1;min-width:0}
.witem .t{font-weight:700;word-wrap:break-word;line-height:1.3}
.witem .sub{font-size:13px;color:var(--muted);margin-top:3px;word-break:break-word}
.witem .resv{margin-top:8px;display:flex;align-items:center;gap:8px}
.erow{display:flex;gap:10px;align-items:flex-start}
.phbtn{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:none}
.phlab{font-size:12px;font-weight:700;color:var(--blue)}
.gift{flex-direction:column}
.gift .ginfo{display:flex;flex-direction:column;gap:6px}
@media(max-width:619px){.gift{flex-direction:row;align-items:flex-start;gap:12px}.ph.gimg{width:96px;height:96px;aspect-ratio:auto}.gift .ginfo{flex:1;min-width:0}}
.btn[disabled]{opacity:.55}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.namebtn{min-height:64px;border:0;border-radius:16px;background:linear-gradient(180deg,#2f6bff,#1645c4);color:#fff;font:inherit;font-size:20px;font-weight:800;box-shadow:0 4px 0 #0f328f;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:10px}
.namebtn:active{transform:translateY(2px);box-shadow:0 2px 0 #0f328f}
.namebtn.on{background:linear-gradient(180deg,#ffd970,#f0c24b 55%,#c9952a);color:#2a1d00;box-shadow:0 4px 0 #9a6f16}
.namebtn .lock{font-size:14px}
#pinf,#sf{margin-top:14px}
pre.share{white-space:pre-wrap;word-break:break-word;background:#f3f6fd;border-radius:12px;padding:12px;font:inherit;font-size:14px;margin:8px 0 10px;color:#22305a}
.famrow{padding:12px 0;border-bottom:1px solid #edf0f7}.famrow:last-child{border-bottom:0}
.memrow{display:flex;gap:8px;align-items:center;margin:6px 0}.memrow input[type=text]{flex:1}.memrow select{width:auto;max-width:46%;font-size:14px;padding:8px}

.famcode{color:#ffe7a3;font-size:13px;font-weight:700;white-space:nowrap}
a.forgot{display:inline-block;margin-top:12px;font-weight:700;color:var(--blue);text-decoration:none}
a.forgot:hover{text-decoration:underline}
.qrbox{display:flex;justify-content:center;margin:12px 0;background:#fff;padding:12px;border-radius:14px;border:1px solid #e4e9f5}
.qrbox svg{width:220px;height:220px}
.recodes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.recodes code{display:block;text-align:center;background:#f3f6fd;border-radius:10px;padding:8px 6px;font-weight:700;letter-spacing:.04em}
input.totp{letter-spacing:.35em;text-align:center;font-size:22px;font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.memrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0;align-items:center}
@media (max-width:560px){.memrow{grid-template-columns:1fr;}}

.chiplab{margin:12px 0 6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7a86a8}
.chiplab:first-of-type{margin-top:4px}
.price .was{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:#7a86a8;text-decoration:line-through}
.dealbadge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#b42318;color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em;vertical-align:middle}

<script>/* Core helpers: crypto, per-family keys, storage, admin registry */
(function(){
const enc=new TextEncoder(),dec=new TextDecoder();
const C=window.__CFG;

  enc(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},

async function getKey(){if(!KEY)throw new Error('locked');return KEY}
const getRaw=()=>RAW;
/* Family key = PBKDF2(code + ":" + family password). For code "cainers" + the family password this is the original site key, so nothing changes for us. */

/* Remote store: textdb.online (free, no signup). Values are AES-GCM ciphertext under the family key.
   Two routes to the same data: our own proxy on hanukkah-api.cainhq.com (Cloudflare Worker, same domain as the site,
   so phones/networks/blockers that refuse textdb.online still work) and textdb.online directly. Reads go proxy-first,
   writes go direct-first (textdb's 500 writes/day limit is per IP, so writes shouldn't all share the proxy's IP). */

function netFail(route,e){NET.fails.push(route+': '+(e&&e.message||e));if(NET.fails.length>8)NET.fails.shift()}
const STORE={
  prefix:C.prefix,net:NET,
  async raw(key){const k=this.prefix+key,bust='?_='+Date.now();
    const routes=[['proxy',API+'/r/'+k+bust],['direct','https://textdb.online/'+k+bust]];

  async get(key,k){const t=await this.raw(key);if(!t)return null;try{return await openWith(k||await getKey(),t)}catch(e){console.warn('undecryptable',key);return null}},

/* Gift-guide photos are public files now (img/<id>.webp). */
function bundledImg(id){return Promise.resolve('img/'+id+'.webp')}
/* Personal PINs: salted PBKDF2-SHA256; only {salt,h} is stored (inside encrypted data). */
async function pinHash(pin,saltB64){const salt=saltB64?b64u.dec(saltB64):crypto.getRandomValues(new Uint8Array(16));const bits=await deriveRaw(String(pin),b64u.enc(salt),150000);return {salt:b64u.enc(salt),h:b64u.enc(bits)}}
/* PIN key-wrap: lets someone sign in with their personal PIN instead of the family password.
   kw_<slot>_<hash(username)> = family key encrypted under a key derived from the PIN. */
async function sha(s){return b64u.enc(await crypto.subtle.digest('SHA-256',enc.encode(s))).slice(0,12).replace(/[-_]/g,'x')}
async function kwKey(slot,u){return 'kw_'+slot+'_'+await sha(slot+'|'+u)}

async function dropWrap(slot,u){try{await STORE.rawSet(await kwKey(slot,u),null)}catch(e){}}
/* Admin registry: each new family appends an entry sealed to the admin's public key (ECDH P-256 + AES-GCM). Only the admin password can open it. */
async function sealToAdmin(obj){const pub=await crypto.subtle.importKey('raw',b64u.dec(C.adminPub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const eph=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'ECDH',public:pub},eph.privateKey,256);

async function openAdmin(entry,priv){const pub=await crypto.subtle.importKey('raw',b64u.dec(entry.epk),{name:'ECDH',namedCurve:'P-256'},false,[]);const bits=await crypto.subtle.deriveBits({name:'ECDH',public:pub},priv,256);return openWith(await aes(await crypto.subtle.digest('SHA-256',bits)),entry.ct)}
async function adminPriv(rawAdminKey){const k=await aes(rawAdminKey);const b=b64u.dec(C.adminPriv);const pk=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));return crypto.subtle.importKey('pkcs8',pk,{name:'ECDH',namedCurve:'P-256'},false,['deriveBits'])}
async function regRead(){const t=await STORE.raw('registry');if(!t)return [];try{const j=JSON.parse(t);return Array.isArray(j)?j:[]}catch(e){return []}}
async function regAppend(obj){const e=await sealToAdmin(obj);e.id=rid(8);const list=await regRead();list.push(e);await STORE.rawSet('registry',JSON.stringify(list));return e.id}
async function regRemove(id){const list=(await regRead()).filter(e=>e.id!==id);await STORE.rawSet('registry',list.length?JSON.stringify(list):null)}
function normEmail(e){return String(e||'').trim().toLowerCase()}
const isEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normEmail(e));
async function emKey(email){return 'em_'+await sha('em|'+normEmail(email))}
async function emAes(email){return aes(new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode('em|'+C.salt+'|'+normEmail(email)))))}

function planSpin(sp){const D=sp.f-sp.s0,dist=Math.abs(D),dir=Math.sign(D)||1,ev=[];if(dist<1e-6)return;

    const p=1-Math.cbrt(1-u),t=p*sp.T,w=dist*3*(1-p)*(1-p)/sp.T;if(t-last<.05)continue;last=t;const slow=Math.max(0,1-w/14);

  plan={sp,ev,i:0,h:[],iv:setInterval(pump,80)};pump()}
function pump(){const P=plan;if(!P)return;const sp=P.sp;const nowS=(performance.now()-sp.start)/1000;
  if(muted||!SA.canPlay()){if(!muted)SA.resume();while(P.i<P.ev.length&&P.ev[P.i].t<nowS)P.i++;return}
  const at0=SA.now();
  while(P.i<P.ev.length&&P.ev[P.i].t<nowS+.3){const e=P.ev[P.i++];if(e.t<nowS-.04&&!e.jack)continue;const at=at0+Math.max(0,e.t-nowS);
    const h=SA.play(e.k,{vol:e.vol,rate:e.rate,at});if(e.k[0]==='t')SND.ticks++;
    if(e.riser){SND.riser++;riser=h||{stop(){}};}
    if(e.jack){sp.jack=true;SND.jackpot++;setTimeout(()=>{if(riser){riser.stop(.03);riser=null}buzz([40,50,40,50,90])},Math.max(0,(e.t-nowS)*1000))}
    else if(h)P.h.push(h);
    if(e.hz&&navigator.vibrate)setTimeout(()=>buzz(6),Math.max(0,(e.t-nowS)*1000))}
  if(P.i>=P.ev.length){clearInterval(P.iv);plan=null}}

  for(let k=0;k<16;k++)stars.push({x:Math.random()*W,y:Math.random()*H*.45+H*.03,r:(8+Math.random()*12)*dpr,t0:300+k*220,ph:Math.random()*6});
  fw={parts,stars,start,step(now){const el=now-start;fctx2.clearRect(0,0,W,H);
    if(el<4200&&el>next){next=el+300+Math.random()*320;const cx=W*(.12+Math.random()*.76),cy=H*(.08+Math.random()*.42);rockets.push({x:cx+(Math.random()-.5)*W*.12,cx,cy,t0:el,d:420+Math.random()*120,col:cols[Math.random()*cols.length|0],col2:cols[Math.random()*cols.length|0]});fwLaunch()}
    for(let r=rockets.length-1;r>=0;r--){const k=rockets[r];const q=Math.min(1,(el-k.t0)/k.d),e2=1-Math.pow(1-q,2);const x=k.x+(k.cx-k.x)*e2,y=H+(k.cy-H)*e2;fctx2.globalAlpha=.9;fctx2.strokeStyle='#fff1b8';fctx2.lineWidth=2*dpr;fctx2.beginPath();fctx2.moveTo(x,y);fctx2.lineTo(x-(k.cx-k.x)*.04,y+28*dpr);fctx2.stroke();

      for(const rot of [0,Math.PI]){fctx2.beginPath();for(let k=0;k<3;k++){const an=rot-Math.PI/2+k*2*Math.PI/3;fctx2[k?'lineTo':'moveTo'](Math.cos(an)*s.r,Math.sin(an)*s.r)}fctx2.closePath();fctx2.stroke()}fctx2.restore()}
    fctx2.globalAlpha=1;fctx2.globalCompositeOperation='source-over';

/* ---- spin control ---- */
const easeOut=p=>1-Math.pow(1-p,3);
function startSpin(dirWorld,speedPxMs,wantFlip){
  unlock();landed=false;idle=false;fw=null;fctx2.clearRect(0,0,fx.width,fx.height);
  if(wantFlip!==flipped){tumble={p:0,start:performance.now(),from:flipped?Math.PI:0,to:wantFlip?Math.PI:0,dur:.9,swapped:false};}
  const fl=wantFlip;const localDir=(fl?-1:1)*dirWorld;
  const w0=Math.min(32,Math.max(8,speedPxMs*18));const T=10;let total=w0*T/3;
  const s0=s;let f=s0+localDir*total;const tb=targetAngle(fl);const TAU=Math.PI*2;
  if(localDir>0){f+=((tb-f)%TAU+TAU)%TAU}else{f-=((f-tb)%TAU+TAU)%TAU}

  const sp=spinning;clearTimeout(failT);failT=setTimeout(()=>{if(spinning===sp){s=sp.f;tiltAmp=0;if(tumble){flipped=tumble.to>1;setTextFlip(flipped);tumble=null}applyPose();placeCamera();renderer.render(scene,camera);finishSpin()}},(T+1.5)*1000); /* failsafe: always lands, even if frames stall */
  const h=document.getElementById('dhint');if(h)h.textContent='';
}
function finishSpin(){const sp=spinning;spinning=null;clearTimeout(failT);stopWhoosh();if(!sp||!sp.jack){stopRiser();jackpot()}cancelPlan(true);landed=true;celebrated=false;zoomAnim={from:zoom,to:1,t:0,d:1.2,then:()=>{celebrate()}};
  clearTimeout(celT);celT=setTimeout(()=>{if(!celebrated){zoomAnim=null;zoom=1;celebrate()}},1700)}
function celebrate(){if(celebrated)return;celebrated=true;clearTimeout(celT);if(!reduce){fireworks();playSong()}onLand(flipped)}

/* ---- input ---- */
let ptr=null,lastFace=0;
function down(e){unlock();if(spinning||tumble)return;ptr={id:e.pointerId,x:e.clientX,y:e.clientY,samples:[[performance.now(),e.clientX,e.clientY]],moved:0};try{canvas.setPointerCapture(e.pointerId)}catch(_){}}

  if(!spinning&&!tumble){const tot=Math.abs(e.clientX-ptr.x)>Math.abs(e.clientY-ptr.y);if(tot){s+=dx*.012*(flipped?-1:1);idle=false;dirty=true}}e.preventDefault()}
function up(e){if(!ptr||e.pointerId!==ptr.id)return;const now=performance.now();const sm=ptr.samples.filter(q=>now-q[0]<110);const a=sm[0]||ptr.samples[0];const dt=Math.max(16,now-a[0]);const vx=(e.clientX-a[1])/dt,vy=(e.clientY-a[2])/dt;
  const dxT=e.clientX-ptr.x,dyT=e.clientY-ptr.y;ptr=null;const sp=Math.hypot(vx,vy);
  if(reduce)return;
  if(sp<.15&&Math.hypot(dxT,dyT)<30)return;
  const vertical=Math.abs(dyT)>Math.abs(dxT)*1.2;
  if(vertical){startSpin(dyT>0?1:-1,Math.max(sp,.4),true)}else{startSpin(dxT>0?1:-1,Math.max(sp,.4),false)}}

/* ---- loop ---- */
let curDpr=dpr,slowN=0,ema=1/60;

function perfGuard(rawDt){if(rawDt>.25)return;ema=ema*.9+rawDt*.1;if(ema>.026&&curDpr>1){if(++slowN>40){curDpr=Math.max(1,curDpr-.5);renderer.setPixelRatio(curDpr);resize();slowN=0;ema=1/60}}else slowN=0}

  else if(idle){s+=dt*.35*(flipped?-1:1);tiltAmp=.02;prec+=dt*1.2}
  else if(tiltAmp>0){tiltAmp=Math.max(0,tiltAmp-dt*.2)}
  if(zoomAnim){zoomAnim.t+=dt;const p=Math.min(1,zoomAnim.t/zoomAnim.d);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;zoom=zoomAnim.from+(zoomAnim.to-zoomAnim.from)*e;if(p>=1){const th=zoomAnim.then;zoomAnim=null;th&&th()}}

if(reduce){s=targetAngle(false);idle=false;zoom=1;applyPose();placeCamera();renderer.render(scene,camera);onLand(false);}
raf=requestAnimationFrame(frame);
/* testing hooks */
const api={dispose(){disposed=true;clearTimeout(failT);clearTimeout(celT);cancelPlan();if(songH)songH.stop();cancelAnimationFrame(raf);ro.disconnect();stopWhoosh();stopRiser();releaseSilent();renderer.dispose();fctx2.clearRect(0,0,fx.width,fx.height)},
  spin:(dir,speed,flip)=>startSpin(dir,speed,flip),audio:()=>({...SA.status(),snd:{...SND},tapShown:!!document.querySelector('.soundtap')}),
  state:()=>({s,flipped,landed,spinning:!!spinning,facing:(()=>{const TAU=Math.PI*2;const base=flipped?Math.PI:0;const i=(((base-s)/A)%N+N)%N;return {index:Math.round(i)%N,err:Math.abs(i-Math.round(i)),name:names[Math.round(i)%N]}})()}),

async function saveGroup(slot,g){g.v=2;g.updated=Date.now();LS.set('chd_cfg_'+slot,JSON.stringify(g));await STORE.set('cfg_'+slot,g)}
async function loadGroup(slot){
  let g=null,remoteOk=true;try{g=await STORE.get('cfg_'+slot)}catch(e){remoteOk=false;console.warn(e)}
  const local=JSON.parse(LS.get('chd_cfg_'+slot)||'null');
  if(g){if(FAM&&FAM.home&&(g.v||1)<2&&DEF&&DEF.managedBy){g.members.forEach(m=>{if(!m.m&&DEF.managedBy[m.n])m.m=DEF.managedBy[m.n]})}/* v1 data: apply Emily->Wendy etc. (saved next time the organizer saves) */
    if(!g.fpw&&FAM&&FAM.home)g.fpw=DEF.fpw;LS.set('chd_cfg_'+slot,JSON.stringify(g));return g}
  if(!remoteOk&&local)return local;
  if(!remoteOk&&FAM&&FAM.home&&CFG.snap&&CFG.snap[slot]){try{const sg=await openWith(await window.CHD.getKey(),CFG.snap[slot]);console.warn('using built-in snapshot of',slot);return sg}catch(e){}}
  if(!remoteOk)throw new Error(NETMSG);
  /* First visit ever for this group: create it once and adopt whatever the server keeps (avoids two phones making different groups). */
  if(!FAM||!FAM.home)throw new Error('That family doesn\u2019t exist anymore. It may have been deleted.');
  g=local||newGroup(DEF);
  try{await STORE.set('cfg_'+slot,g);const back=await STORE.get('cfg_'+slot);if(back)g=back}catch(e){console.warn(e)}
  LS.set('chd_cfg_'+slot,JSON.stringify(g));return g;
}
const seedFor=name=>{const k=Object.keys(SEEDS).find(k=>k.toLowerCase()===String(name).trim().toLowerCase());return k?SEEDS[k].map((x,i)=>({id:'seed'+i,t:x.t,u:x.u||'',p:x.p||'',im:x.im||''})):[]};
async function loadWish(gid,s,name){
  let w=null,err=null;try{w=await STORE.get('w_'+gid+'_'+s)}catch(e){err=e}
  if(!w&&err){const local=JSON.parse(LS.get('chd_w_'+gid+'_'+s)||'null');if(local)w=local}
  if(!w)return {items:seedFor(name),seeded:true,err};
  return {items:(w.items||[]).slice(0,MAXI),seeded:false,err};
}
async function loadRes(gid,s){try{return (await STORE.get('r_'+gid+'_'+s))||{ids:{}}}catch(e){return {ids:{},err:e}}}
const resBy=v=>v&&typeof v==='object'?v.by:(v?'?':'');
async function setRes(gid,s,itemId,by,on){ /* read-modify-write so two people reserving at once don't clobber each other */
  const r=await loadRes(gid,s);if(r.err)throw r.err;r.ids=r.ids||{};
  if(on){const cur=resBy(r.ids[itemId]);if(cur&&cur!==by)return {r,taken:cur};r.ids[itemId]={by,at:Date.now()}}else{if(resBy(r.ids[itemId])===by||resBy(r.ids[itemId])==='?')delete r.ids[itemId]}
  await STORE.set('r_'+gid+'_'+s,r);return {r}}

/* Accounts: one encrypted record per group, acc_<gid> = {a:{Name:{u?,e?,salt?,h?,ver,tf?,ts?,rc?}}}. Members register with the family code, then sign in with email + their password. First-name + family password is a fallback only until that member registers. */
let S={slot:null,g:null,acc:null,me:null};
const adults=()=>S.g.members.filter(m=>!m.m);
const memberBy=n=>S.g.members.find(m=>m.n===n);
const uname=n=>((S.acc.a||{})[n]||{}).u||n.toLowerCase();
const emailOf=n=>normEmail(((S.acc.a||{})[n]||{}).e||'');
const accOf=n=>(S.acc.a||{})[n]||{};
const isRegistered=n=>!!(emailOf(n)||accOf(n).h);
async function loadAcc(gid){try{return (await STORE.get('acc_'+gid))||{a:{}}}catch(e){return {a:{},err:e}}}
async function mutAcc(fn){const fresh=await loadAcc(S.g.gid);fresh.a=fresh.a||{};const r=fn(fresh);await STORE.set('acc_'+S.g.gid,fresh);S.acc=fresh;return r}
const sessKey=()=>'chd_me_'+S.g.gid;
function readSession(){let j=null;try{j=JSON.parse(LS.get(sessKey())||sessionStorage.getItem(sessKey())||'null')}catch(e){}if(!j)return null;const m=memberBy(j.n);if(!m||m.m)return null;if((accOf(j.n).ver||0)!==j.v)return null;return j.n}
function writeSession(n,persist){const v=JSON.stringify({n,v:accOf(n).ver||0});LS.del(sessKey());if(persist)LS.set(sessKey(),v);else try{sessionStorage.setItem(sessKey(),v)}catch(e){}}
async function boot(force){
  await restoreFamily();if(!FAM){S.g=null;S.me=null;return S}
  const slot=groupSlot();
  if(force||!S.g||S.slot!==slot){S.slot=slot;S.g=await loadGroup(slot);S.acc=await loadAcc(S.g.gid);}
  S.me=readSession();return S;
}

async function route(){
  const h=location.hash.replace(/^#\/?/,'').split('?')[0];
  const [path,...rest]=h.split('/');let arg=rest.join('/');try{arg=decodeURIComponent(arg)}catch(e){}
  window.scrollTo(0,0);
  if(window.__dreidel&&window.__dreidel.dispose){window.__dreidel.dispose();window.__dreidel=null}
  try{
    if(path==='p'&&arg)return await renderReveal(await open(arg),{link:true});
    if(path==='w'&&arg)return await renderWishOnly(arg);
    if(path==='admin')return await renderAdmin();
    if(path==='new')return await renderCreate();
    if(path==='forgot')return renderForgot();
    if(path==='reset'&&arg)return renderReset(arg);
    if(path==='register'){try{await boot()}catch(e){}if(S.me){go('#/');return}return await renderRegister(arg||'')}
    if(path==='j'&&arg){LS.set('chd_lastcode',arg.toLowerCase());if(FAM&&FAM.code!==arg.toLowerCase()){/* a link for a different family */}}
    if(!S.g&&path!=='guide')app.innerHTML=`<div class="card" style="margin-top:30vh;text-align:center"><p class="muted">🕎 Loading…</p></div>`;
    try{await boot()}catch(e){if(path!=='guide')throw e}
    if(path==='guide')return renderGuide();
    if(path==='j'&&arg&&FAM&&FAM.code!==arg.toLowerCase())return renderSignIn(arg.toLowerCase());
    if(!S.me)return renderSignIn(path==='j'?arg:'');
    if(path==='wishlists')return await renderWishlists();
    if(path==='list'&&arg)return await renderList(arg);
    if(path==='profile')return renderProfile();
    if(path==='organize')return await renderOrganizer();
    if(path==='draw'&&arg)return await renderMemberDraw(arg);
    return await renderHome();
  }catch(e){console.error(e);app.innerHTML=shell(`<div class="card"><h2>Hmm, that didn't open.</h2><p class="muted">${esc(e.message)}</p><a class="btn" href="#/" onclick="location.reload()">Try again</a></div>`)}
}

/* ---------- Sign in: email + password, or first name + family password until that member registers; family code is shown after login ---------- */
async function tokenKey(tok){return 'rt_'+await sha('rt|'+tok)}
async function tokenAes(tok){return aes(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rt|'+tok))))}
async function mintReset(n){const tok=rid(24);const raw=getRaw();if(!raw)throw new Error('No family key on this device.');const a=accOf(n);const payload={exp:Date.now()+2*60*60*1000,n,code:FAM.code,slot:FAM.slot,u:uname(n),e:emailOf(n)||'',raw:b64u.enc(raw),tf:!!(a.tf&&a.ts)};await STORE.rawSet(await tokenKey(tok),await sealWith(await tokenAes(tok),payload));return siteUrl()+'#/reset/'+tok}
async function openReset(tok){const t=await STORE.raw(await tokenKey(tok));if(!t)return null;try{const p=await openWith(await tokenAes(tok),t);if(!p||!p.exp||p.exp<Date.now()||!p.raw)return null;return p}catch(e){return null}}
async function consumeReset(tok){try{await STORE.rawSet(await tokenKey(tok),null)}catch(e){}}
async function unlockFamily(code,p,pinUser){
  const slot=slotFor(code);let raw=await deriveRaw(code+':'+p),viaPin=false,okFam=false;let k=await aes(raw);
  if(code===HOME){try{await openWith(k,CFG.priv);okFam=true}catch(e){if(p!==p.trim()){const r2=await deriveRaw(code+':'+p.trim()),k2=await aes(r2);try{await openWith(k2,CFG.priv);okFam=true;raw=r2;k=k2}catch(_){}}}}
  else{try{const t=await STORE.getStrict('cfg_'+slot,k);if(t===undefined)throw new Error('No family uses that code yet.');okFam=true}catch(e){if(e.network)throw new Error(NETMSG);if(/No family/.test(e.message))throw e}}
  if(!okFam){let r2=null;const tryU=async(u,pw)=>{if(!u||r2)return;try{r2=await unwrapKey(slot,u,pw)}catch(e){if(e.network)throw new Error(NETMSG)}};
    await tryU(pinUser,p);if(!r2&&p!==p.trim())await tryU(pinUser,p.trim());if(!r2)throw new Error(code===HOME?'That password didn\u2019t work for the '+code+' family. Check it and try again.':'That email or password didn\u2019t work.');raw=r2;viaPin=true}
  return {raw,viaPin,slot};
}
async function admit(m,rem){const a=accOf(m.n);if(a.tf&&a.ts){renderTwoStep(m,rem);return}await finishAdmit(m,rem)}
async function finishAdmit(m,rem){writeSession(m.n,rem);S.me=m.n;toast('Welcome, '+m.n+'!');go('#/')}
async function checkSecondFactor(m,code){const a=accOf(m.n);if(await totpOk(a.ts,code))return 'ok';const i=await recOk(a.rc||[],code);if(i>=0){await mutAcc(acc=>{const list=(acc.a[m.n].rc||[]).slice();list.splice(i,1);acc.a[m.n].rc=list});return 'recovery'}return ''}
function renderTwoStep(m,rem){

    try{const r=await checkSecondFactor(m,$('#tc').value);if(!r)throw new Error('That code didn\u2019t work. Try a current authenticator code or a recovery code.');if(r==='recovery')toast('Signed in with a recovery code. You have '+(accOf(m.n).rc||[]).length+' left.');await finishAdmit(m,rem)}

async function setMemberEmail(n,email){
  email=normEmail(email);
  if(email&&!isEmail(email))throw new Error('Enter a valid email address.');
  const old=emailOf(n);
  if(email){const ptr=await lookupEmail(email);if(ptr&&!(ptr.code===FAM.code&&(ptr.u===uname(n)||ptr.u===n.toLowerCase())))throw new Error('That email is already used on another account.');await putEmail(email,{code:FAM.code,slot:FAM.slot,u:uname(n)})}
  if(old&&old!==email)await dropEmail(old);
  await mutAcc(acc=>{acc.a[n]=Object.assign(acc.a[n]||{},{e:email||undefined});if(!email)delete acc.a[n].e});
  const mem=memberBy(n);
  if(mem&&email&&mem.m){mem.m='';if(S.g){S.g.updated=Date.now();await saveGroup(groupSlot(),S.g)}}
}
async function openFamilyForRegister(code){
  code=String(code||'').trim().toLowerCase();
  if(!/^[a-z0-9-]{3,16}$/.test(code))throw new Error('Enter the family code. It is 3\u201316 letters, numbers or dashes.');
  const raw=await deriveRaw(code+':'+DEFAULT_PW);
  const k=await aes(raw);
  try{
    if(code===HOME)await openWith(k,CFG.priv);
    else{const t=await STORE.getStrict('cfg_'+code,k);if(t===undefined)throw new Error('That family code didn\u2019t work. Check it and try again.')}
  }catch(e){if(e.network)throw new Error(NETMSG);if(/didn.?t work/.test(e.message)||e.message===NETMSG)throw e;throw new Error('That family code didn\u2019t work. Check it and try again.')}
  await useFamily(code,raw,false);await boot(true);
}

/* ---------- Draw algorithm ---------- */
function makeDraw(names,excl){
  // excl: array of [a,b] meaning a may not give to b AND b may not give to a
  const n=names.length,bad=new Set();excl.forEach(([a,b])=>{bad.add(a+'\u0000'+b);bad.add(b+'\u0000'+a)});
  const ok=(g,r)=>g!==r&&!bad.has(g+'\u0000'+r);
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
  for(let attempt=0;attempt<200;attempt++){
    const givers=shuffle([...names]),used=new Set(),res={};let steps=0;
    const bt=i=>{if(++steps>20000)return false;if(i===n)return true;const g=givers[i];for(const r of shuffle([...names])){if(used.has(r)||!ok(g,r))continue;used.add(r);res[g]=r;if(bt(i+1))return true;used.delete(r);delete res[g]}return false};
    if(bt(0))return res;
  }
  return null;
}
window.__makeDraw=makeDraw;

  <p class="chiplab">Deals</p>
  <div class="chips" id="deals">${deals.map(([v,l],i)=>`<button class="pill ${i?'':'on'}" data-d="${v}">${l}</button>`).join('')}</div>

  <p class="count small">Prices and listed deals were checked November 24, 2026 and change often (especially around Black Friday). A Deals filter only shows items with a verified typical/list price on the store page. Check the store before buying. Gift cards can be any amount.</p>`,'guide');
  let band='all',deal='all',cat='All';
  const draw=()=>{const q=$('#q').value.trim().toLowerCase();
    const list=GIFTS.map((g,i)=>({...g,i})).filter(g=>{
      if(cat!=='All'&&g.c!==cat&&!(g.t||[]).includes(cat))return false;
      if(band!=='all'&&g.p!=null){const p=g.p;if(band==='25'&&!(p<25))return false;if(band==='50'&&!(p>=25&&p<50))return false;if(band==='110'&&!(p>=50&&p<=110))return false}
      if(deal!=='all'){if(dealPct(g)<+deal)return false}
      if(q&&!(g.n+' '+g.w+' '+g.s+' '+g.c+' '+(g.t||[]).join(' ')).toLowerCase().includes(q))return false;return true});
    $('#count').textContent=list.length+' gift'+(list.length===1?'':'s');
    $('#gifts').innerHTML=list.map(g=>{const off=dealPct(g);const price=g.p==null?'Any amount':`~${money(g.p)}${off?`<span class="was">${money(g.was)}</span><span class="dealbadge">${off}% off</span>`:''}`;return `<article class="gift">${photoHTML(g,'','ph gimg')}<div class="ginfo"><div class="top"><div class="name">${esc(g.n)}</div><div class="price">${price}</div></div><div class="why">${esc(g.w)}</div><div class="meta"><span class="tag blue">${esc(g.c)}</span><span class="tag">${esc(g.s)}</span></div>
      <div class="row" style="margin-top:4px"><a class="btn sm ghost go" href="${esc(g.u)}" target="_blank" rel="noopener noreferrer">View at ${esc(g.s)} ↗</a>${S.me?`<button class="btn sm" data-add="${g.i}">＋ My wishlist</button>`:''}</div></div></article>`}).join('')||'<p class="count">Nothing matches. Try another word.</p>';
    hydrate($('#gifts'));
    $$('[data-add]').forEach(b=>b.onclick=async()=>{const gi=GIFTS[+b.dataset.add],m=memberBy(S.me);b.disabled=true;
      try{const ctx=await loadWish(S.g.gid,m.s,m.n);const items=ctx.items.filter(i=>i.t);if(items.length>=MAXI){toast(`Your list already has ${MAXI} items`);b.disabled=false;return}
        if(items.some(i=>i.t===gi.n)){toast('Already on your list');return}
        items.push({id:rid(8),t:gi.n,u:gi.u,p:gi.p==null?'':String(gi.p),im:gi.im||''});await STORE.set('w_'+S.g.gid+'_'+m.s,{items,updated:Date.now(),by:S.me});b.textContent='✓ Added';toast('Added to your wishlist')}catch(e){b.disabled=false;toast('Couldn\u2019t add. Try again.')}});
  };
  $('#q').addEventListener('input',draw);
  $('#bands').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;band=b.dataset.v;$$('#bands .pill').forEach(x=>x.classList.toggle('on',x===b));draw()});
  $('#deals').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;deal=b.dataset.d;$$('#deals .pill').forEach(x=>x.classList.toggle('on',x===b));draw()});
  $('#cats').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;$$('#cats .pill').forEach(x=>x.classList.toggle('on',x===b));draw()});
  draw();
}

  app.innerHTML=shell(`<section class="hero"><h1>${esc(me)}'s <span class="gold">profile</span></h1><p>Your name stays ${esc(me)} everywhere. These only change how you sign in.</p></section>

  <div class="card"><h2>✉️ Email (your username)</h2><p class="muted small">${em?'You sign in with <b id="cure">'+esc(em)+'</b>.':'Add your email. That becomes your username.'}</p>
    <div class="row"><input id="ne" class="grow" type="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="you@example.com" value="${esc(em)}"><button class="btn sm" id="nesave">Save</button></div><div class="status" id="nest"></div></div>
  <div class="card"><h2>👤 Name in the family</h2><p class="muted small">Your name stays <b>${esc(me)}</b>. ${em?'You sign in with your email, not this name.':'Until you register, you can sign in with <b id="curu">'+esc(uname(me))+'</b>.'}</p>
    <div class="row"><input id="nu" class="grow" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Username" value="${esc(uname(me))}"><button class="btn sm" id="nusave">Save</button></div><div class="status" id="nust"></div></div>
  <div class="card"><h2>🔒 Password <span class="tag ${a.h?'green':''}">${a.h?'Your own':'Family password'}</span></h2>
    <p class="muted small">${a.h?'You sign in with your own password (the family password no longer works for you).':'Right now you sign in with the family password. Set your own password (4+ characters) if you want a private one.'}</p>
    <input id="p1" type="password" autocomplete="new-password" placeholder="New password"><input id="p2" type="password" autocomplete="new-password" placeholder="Type it again" style="margin-top:8px">
    <button class="btn gold block" id="psave" style="margin-top:10px">${a.h?'Change my password':'Set my password'}</button><div class="status" id="pst"></div></div>
  <div class="card" id="tcard"><h2>🛡️ Two-step verification <span class="tag ${a.tf?'green':''}">${a.tf?'On':'Off'}</span></h2>
    <p class="muted small">${a.tf?'An authenticator app code (or a recovery code) is required after your password. This is off by default for everyone else.':'Optional. Turn this on to require a code from an authenticator app after your password. Off by default.'}</p>
    ${a.tf?`<button class="btn ghost block" id="toff">Turn off two-step verification</button><p class="small muted" style="margin-top:8px">Lost your authenticator? Use a recovery code to sign in, or ask the organizer to reset two-step for you.</p>`:`<button class="btn gold block" id="ton">Turn on with an authenticator app</button>`}
    <div id="tsetup"></div><div class="status" id="tst"></div></div>
  <div class="card"><a class="btn ghost block" href="#/list/${encodeURIComponent(me)}">📝 My wishlist</a>${isOrg()?`<a class="btn ghost block" href="#/organize" style="margin-top:8px">✡️ Organizer</a>`:''}<button class="btn danger block" id="so" style="margin-top:8px">Sign out of ${esc(me)}</button></div>`,'profile');
  $('#nesave').onclick=async()=>{const st=$('#nest');st.textContent='Saving\u2026';try{await setMemberEmail(me,$('#ne').value);st.textContent=$('#ne').value.trim()?'Saved \u2713 Sign in with this email from now on.':'Email removed. You can sign in with your first name until you register again.';const el=$('#cure');if(el)el.textContent=emailOf(me)}catch(e){st.textContent=e.message}};
  $('#nusave').onclick=async()=>{const v=$('#nu').value.trim().toLowerCase(),st=$('#nust');
    if(!/^[a-z0-9._-]{2,24}$/.test(v)){st.textContent='Use 2\u201324 letters, numbers, dots, dashes or underscores.';return}
    if(v===uname(me)){st.textContent='That\u2019s already your username.';return}
    st.textContent='Saving\u2026';
    const oldU=uname(me),hadPin=!!accOf(me).h,emNow=emailOf(me);
    try{const taken=await mutAcc(acc=>{const others=adults().filter(m=>m.n!==me);const clash=others.some(m=>((acc.a[m.n]||{}).u||m.n.toLowerCase())===v)||S.g.members.some(m=>m.n!==me&&m.n.toLowerCase()===v);if(clash)return true;acc.a[me]=Object.assign(acc.a[me]||{},{u:v});return false});
      if(taken){st.textContent='Someone else already uses that one.';return}
      if(hadPin)await moveWrap(FAM.slot,oldU,v);

  $('#psave').onclick=async()=>{const p1=$('#p1').value,p2=$('#p2').value,st=$('#pst');
    if(p1.length<4){st.textContent='Make it at least 4 characters.';return}if(p1!==p2){st.textContent='Those two don\u2019t match.';return}if(p1===DEFAULT_PW||p1.trim()===DEFAULT_PW){st.textContent='Pick a password of your own.';return}
    st.textContent='Saving\u2026';try{const ph=await pinHash(p1);await wrapKey(FAM.slot,uname(me),p1,getRaw());await mutAcc(acc=>{acc.a[me]=Object.assign(acc.a[me]||{},ph)});writeSession(me,!!LS.get(sessKey()));toast('Password saved');renderProfile()}catch(e){st.textContent='Couldn\u2019t save. Try again.'}};
  const pc=$('#pclear');if(pc)pc.onclick=async()=>{if(!confirm('Go back to signing in with the family password?'))return;try{await dropWrap(FAM.slot,uname(me));await mutAcc(acc=>{const x=acc.a[me]||{};delete x.h;delete x.salt;acc.a[me]=x});toast('Now using the family password');renderProfile()}catch(e){toast('Couldn\u2019t save')}};
  const ton=$('#ton');if(ton)ton.onclick=async()=>{const box=$('#tsetup'),st=$('#tst');st.textContent='';
    try{const secret=newSecret(),uri=otpauth(me,secret),svg=await qrSvg(uri),codes=newRecovery();
      box.innerHTML=`<p class="muted small">Scan this with Google Authenticator, 1Password, or any authenticator app, then enter the 6-digit code to confirm. You'll get recovery codes next.</p>
        <div class="qrbox">${svg}</div>
        <p class="center small muted">Or type this secret: <b class="mono">${esc(secret)}</b></p>
        <label for="tconf">Code from the app</label><input id="tconf" class="totp" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
        <button class="btn gold block" id="tconfirm" style="margin-top:10px">Confirm and turn on</button>`;
      $('#tconfirm').onclick=async()=>{st.textContent='Checking\u2026';
        if(!await totpOk(secret,$('#tconf').value)){st.textContent='That code didn\u2019t match. Wait for a new one and try again.';return}
        const hashed=await Promise.all(codes.map(hashRec));
        await mutAcc(acc=>{acc.a[me]=Object.assign(acc.a[me]||{},{tf:1,ts:secret,rc:hashed})});
        box.innerHTML=`<p><b>Two-step is on.</b> Save these recovery codes somewhere safe. They won't be shown again. Each one works once.</p>
          <div class="recodes">${codes.map(c=>`<code>${esc(c)}</code>`).join('')}</div>
          <button class="btn ghost block" id="tcopy" style="margin-top:10px">Copy recovery codes</button>`;
        $('#tcopy').onclick=()=>copy(codes.join('\n'));st.textContent='';ton.remove();const tag=$('#tcard .tag');if(tag){tag.textContent='On';tag.classList.add('green')}}
    }catch(e){st.textContent='Couldn\u2019t start setup. '+e.message}};
  const toff=$('#toff');if(toff)toff.onclick=async()=>{const code=prompt('Enter a current authenticator code or a recovery code to turn two-step off.');if(code==null)return;
    try{if(!await checkSecondFactor({n:me},code)){toast('That code didn\u2019t work.');return}await mutAcc(acc=>{const x=acc.a[me]||{};delete x.tf;delete x.ts;delete x.rc;acc.a[me]=x});toast('Two-step verification is off');renderProfile()}catch(e){toast('Couldn\u2019t save')}};
  $('#so').onclick=()=>{LS.del(sessKey());S.me=null;go('#/')};
}

function baseDef(){if(FAM&&FAM.home&&DEF)return DEF;const o=S.g.orig||{};return {title:S.g.title,organizer:o.organizer||S.g.organizer,handoffOrganizer:o.organizer||S.g.organizer,budget:o.budget||S.g.budget,date:o.date||'',members:o.members||S.g.members.map(m=>m.n),managedBy:o.managedBy||{},exclusions:[]}}

  const paint=async()=>{
    const names=g.members.map(m=>m.n);const drawn=!!g.assign;

    const drawCard=drawn?`<div class="card" id="links"><h2>✅ Names are drawn</h2><p class="muted">Everyone sees their own match on their home screen after they sign in. ${g.members.filter(m=>m.m).map(m=>m.n).join(', ')||'Kids'}'s spins are on their manager's home screen.</p>
      <button class="btn gold block copymsg">Copy a message for the family text</button>

    $$('[data-reset]').forEach(b=>b.onclick=async()=>{const n=b.dataset.reset;if(!confirm(`Reset ${n}'s login? Their username goes back to "${n.toLowerCase()}" and their password back to the family password. Two-step verification stays on if they had it.`))return;
      try{const prev=accOf(n);if(prev.h)await dropWrap(FAM.slot,uname(n));const em=emailOf(n);await mutAcc(acc=>{const v=((acc.a[n]||{}).ver||0)+1;const keep={ver:v};if(em)keep.e=em;if(prev.tf&&prev.ts){keep.tf=1;keep.ts=prev.ts;if(prev.rc)keep.rc=prev.rc}acc.a[n]=keep});if(em)await putEmail(em,{code:FAM.code,slot:FAM.slot,u:n.toLowerCase()});toast(n+'\u2019s login was reset');paint()}catch(e){toast('Couldn\u2019t reset. Try again.')}});

      for(const m of adults()){if(accOf(m.n).h)await dropWrap(FAM.slot,uname(m.n));if(emailOf(m.n))await dropEmail(emailOf(m.n))}
      try{await STORE.set('acc_'+g.gid,null)}catch(e){}LS.del('chd_me_'+g.gid);
      const bd=baseDef();g=newGroup(Object.assign({},bd,{organizer:bd.handoffOrganizer||bd.organizer,fname:g.fname,fpw:g.fpw,orig:g.orig,regId:g.regId,created:g.created}));await persist('Reset ✓');S.g=g;S.acc={a:{}};S.me=null;
      alert('Reset done. Fresh start with '+g.organizer+' as the organizer. People who had registered should register again, or use first-name sign-in until they do.');go('#/')};
    const rd=$('#redraw');if(rd)rd.onclick=async()=>{const t=prompt('Redrawing gives everyone a NEW match. Type REDRAW to clear the draw and start over.');if(t!=='REDRAW')return;g.assign=null;g.drawnAt=null;await persist('Draw cleared');paint()};
    $$('[data-del]').forEach(b=>b.onclick=async()=>{const m=g.members[+b.dataset.del];if(!confirm('Remove '+m.n+'?'))return;g.members.splice(+b.dataset.del,1);g.exclusions=g.exclusions.filter(p=>!p.includes(m.n));g.members.forEach(x=>{if(x.m===m.n)x.m=''});await persist();paint()});
    $$('[data-man]').forEach(s=>s.onchange=async()=>{const m=g.members[+s.dataset.man];if(s.value&&g.members.some(x=>x.m===m.n)){toast(m.n+' manages someone else, so they need their own login');s.value=m.m;return}if(m.n===g.organizer&&s.value){toast('The organizer needs their own login');s.value='';return}m.m=s.value;await persist();paint()});
    $$('[data-dx]').forEach(b=>b.onclick=async()=>{g.exclusions.splice(+b.dataset.dx,1);await persist();paint()});
    const add=$('#add');if(add){const doAdd=async()=>{const v=$('#newname').value.trim();if(!v)return;if(g.members.some(m=>m.n.toLowerCase()===v.toLowerCase())){toast('Already on the list');return}g.members.push({n:v,s:rid(16),m:''});readDetails();await persist();paint()};add.onclick=doAdd;$('#newname').onkeydown=e=>{if(e.key==='Enter')doAdd()}}
    const ax=$('#addex');if(ax)ax.onclick=async()=>{const a=$('#ex1').value,b=$('#ex2').value;if(a===b){toast('Pick two different people');return}if(g.exclusions.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))){toast('Already added');return}g.exclusions.push([a,b]);readDetails();await persist();paint()};
    ['title','budget','date'].forEach(id=>{const el=$('#'+id);if(el&&!el.disabled)el.onchange=async()=>{readDetails();await persist()}});
    const og=$('#org');if(og&&!og.disabled)og.onchange=async()=>{if(og.value!==S.me&&!confirm(`Make ${og.value} the organizer? You'll lose access to this page.`)){og.value=g.organizer;return}readDetails();await persist();if(!isOrg())go('#/')};
    const dr=$('#draw');if(dr)dr.onclick=async()=>{readDetails();if(g.members.length<3){toast('Add at least 3 people');return}
      const res=makeDraw(g.members.map(m=>m.n),g.exclusions);
      if(!res){alert('No valid draw is possible with these exclusions. Remove one and try again.');return}
      g.assign=res;g.drawnAt=new Date().toISOString();await persist('Names drawn ✓');showAll=false;await paint();const l=$('#links');if(l)l.scrollIntoView({behavior:'smooth'})};
  };
  await paint();
}

/* ---------- Organizer registration (admin-locked; not public sign-up) ---------- */
const slugify=t=>String(t).toLowerCase().replace(/^the\s+/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,16).replace(/-+$/,'');
async function hasAdmin(){const saved=LS.get('chd_admin');if(!saved)return false;try{await adminPriv(b64u.dec(saved));return true}catch(e){LS.del('chd_admin');return false}}
async function renderCreate(){
  if(!await hasAdmin()){
    app.innerHTML=shell(`<a class="back" href="#/">‹ Back</a><section class="hero" style="padding-top:0"><h1>Organizer <span class="gold">registration</span></h1><p>Only a site organizer can register a family. This is not open sign-up.</p></section>
    <form class="card" id="af"><label for="ap">Admin password</label><input id="ap" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn gold block" id="ago" style="margin-top:10px">Continue</button><div class="err" id="ae"></div></form>`);
    $('#af').onsubmit=async ev=>{ev.preventDefault();const b=$('#ago');b.disabled=true;b.textContent='Checking\u2026';
      try{const raw=await deriveRaw('chd-admin:'+$('#ap').value);await adminPriv(raw);LS.set('chd_admin',b64u.enc(raw));renderCreate()}catch(e){$('#ae').textContent='That didn\u2019t work.';b.disabled=false;b.textContent='Continue'}};
    return;
  }
  app.innerHTML=shell(`<a class="back" href="#/admin">‹ Admin</a><section class="hero" style="padding-top:0"><h1>Register a <span class="gold">family</span></h1><p>Enter the family name and everyone’s first name. Members will tap Register, enter this family code, pick their name, and create their own email and password.</p></section>
  <form class="card" id="cf" autocomplete="off">
    <label for="fn">Family name</label><input id="fn" placeholder="e.g. The Goldbergs" maxlength="40" required>
    <label for="fc">Family code <span class="small muted">(members need this to register)</span></label><input id="fc" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="e.g. goldbergs" maxlength="16" required>
    <label for="fo">Organizer's first name</label><input id="fo" autocapitalize="words" placeholder="First name" required>
    <div class="row"><div class="grow"><label for="fb">Budget ($)</label><input id="fb" type="number" min="1" inputmode="numeric" value="100"></div><div class="grow"><label for="fd">Exchange date</label><input id="fd" type="date"></div></div>
    <label>Everyone else</label><p class="small muted" style="margin:0 0 4px">First name for each person. For kids, pick the parent who manages their list. They don’t register or log in.</p>
    <div id="mems"></div><button type="button" class="btn ghost block sm" id="madd">＋ Add a person</button>
    <p class="small muted" style="margin-top:12px">Everything your family adds is encrypted. The site admin can see your family’s name, organizer and size, and can delete it if asked.</p>
    <button class="btn gold block" id="cgo" style="margin-top:6px">Register this family</button><div class="err" id="ce"></div></form>`);
  let rows=[{n:'',m:''},{n:'',m:''},{n:'',m:''}];let codeTouched=false;
  const adultsNow=()=>[$('#fo').value.trim(),...rows.filter(r=>r.n.trim()&&!r.m).map(r=>r.n.trim())].filter(Boolean);
  const paint=()=>{const ad=adultsNow();$('#mems').innerHTML=rows.map((r,i)=>`<div class="memrow"><input type="text" data-r="${i}" placeholder="First name" value="${esc(r.n)}" autocapitalize="words"><select data-k="${i}"><option value="">Adult (own login)</option>${ad.filter(a=>a!==r.n.trim()).map(a=>`<option ${r.m===a?'selected':''} value="${esc(a)}">Kid of ${esc(a)}</option>`).join('')}</select></div>`).join('');
    $$('[data-r]').forEach(x=>{x.oninput=()=>{rows[+x.dataset.r].n=x.value};x.onchange=paint});$$('[data-k]').forEach(x=>x.onchange=()=>{rows[+x.dataset.k].m=x.value;paint()})};
  paint();
  $('#fo').onchange=paint;
  $('#madd').onclick=()=>{rows.push({n:'',m:''});paint();const l=$$('[data-r]').pop();l&&l.focus()};
  $('#fn').oninput=()=>{if(!codeTouched)$('#fc').value=slugify($('#fn').value)};$('#fc').oninput=()=>{codeTouched=true};
  $('#cf').onsubmit=async ev=>{ev.preventDefault();const err=$('#ce'),btn=$('#cgo');err.textContent='';
    try{if(!await hasAdmin())throw new Error('Only a site organizer can register a family.');
      $$('[data-r]').forEach(x=>{rows[+x.dataset.r].n=x.value});$$('[data-k]').forEach(x=>{rows[+x.dataset.k].m=x.value});const fname=$('#fn').value.trim(),code=$('#fc').value.trim().toLowerCase(),pw=DEFAULT_PW,org=$('#fo').value.trim().replace(/\s+/g,' ');
      if(!/^[a-z0-9-]{3,16}$/.test(code))throw new Error('Family code: 3\u201316 lowercase letters, numbers or dashes.');
      if(code===HOME||RESERVED.has(code))throw new Error('That family code is taken. Try another.');
      if(!org)throw new Error('Add the organizer\u2019s first name.');
      const mem=rows.map(r=>({n:r.n.trim().replace(/\s+/g,' '),m:r.m})).filter(r=>r.n);
      const names=[org,...mem.map(r=>r.n)];const low=names.map(n=>n.toLowerCase());
      if(new Set(low).size!==low.length)throw new Error('Each person needs a different name (add a last initial if two share a name).');
      if(names.length<3)throw new Error('Add at least 3 people in total.');
      if(names.some(n=>!/^[\p{L}0-9 .'-]{1,24}$/u.test(n)))throw new Error('Names can use letters, numbers, spaces, dots, dashes and apostrophes.');
      const managedBy={};mem.forEach(r=>{if(r.m&&names.includes(r.m)&&!mem.some(x=>x.n===r.m&&x.m))managedBy[r.n]=r.m});
      btn.disabled=true;btn.textContent='Creating\u2026';
      if(await STORE.raw('cfg_'+code))throw new Error('That family code is taken. Try another.');
      const raw=await deriveRaw(code+':'+pw);
      const budget=Math.max(1,parseInt($('#fb').value,10)||100),date=$('#fd').value||'';
      const orig={organizer:org,budget,date,members:names,managedBy};
      const created=Date.now();
      let regId='';try{regId=await regAppend({code,slot:code,name:fname,organizer:org,members:names.length,created,k:b64u.enc(raw)})}catch(e){console.warn('registry',e)}
      const k=await aes(raw);
      const g=newGroup({title:(fname||code)+' Hanukkah Gift Exchange',fname,fpw:pw,orig,regId,created,organizer:org,budget,date,members:names,managedBy,exclusions:[]});
      await STORE.set('cfg_'+code,g,k);
      await useFamily(code,raw,true);await boot(true);
      writeSession(org,true);S.me=org;
      toast('Family registered. Share the family code so members can register.');go('#/organize');
    }catch(e){err.textContent=e.message;btn.disabled=false;btn.textContent='Register this family'}};
}

/* ---------- Site admin (Cainer only) ---------- */
async function renderAdmin(){
  let priv=null;const saved=LS.get('chd_admin');
  if(saved){try{priv=await adminPriv(b64u.dec(saved))}catch(e){LS.del('chd_admin')}}
  if(!priv){
    app.innerHTML=shell(`<section class="hero"><h1>Site <span class="gold">admin</span></h1></section><form class="card" id="af"><label for="ap">Admin password</label><input id="ap" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn gold block" id="ago" style="margin-top:10px">Open</button><div class="err" id="ae"></div></form>`);
    $('#af').onsubmit=async ev=>{ev.preventDefault();const b=$('#ago');b.disabled=true;b.textContent='Checking…';
      try{const raw=await deriveRaw('chd-admin:'+$('#ap').value);await adminPriv(raw);LS.set('chd_admin',b64u.enc(raw));renderAdmin()}catch(e){$('#ae').textContent='That didn\u2019t work.';b.disabled=false;b.textContent='Open'}};
    return;
  }
  app.innerHTML=shell(`<section class="hero"><h1>Site <span class="gold">admin</span></h1><p>Every family on this site.</p></section><div class="card" id="fams"><p class="muted">Loading…</p></div><p class="center"><a class="btn gold" href="#/new" id="areg">Register a family</a></p><p class="center"><button class="linkbtn" id="alock" style="color:#ffe7a3">Lock admin on this device</button></p>`);
  $('#alock').onclick=()=>{LS.del('chd_admin');renderAdmin()};
  const list=await regRead();const rows=[];
  for(const e of list){try{const d=await openAdmin(e,priv);rows.push({e,d})}catch(x){rows.push({e,d:null})}}
  const when=t=>t?new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
  const info=await Promise.all(rows.map(async r=>{if(!r.d)return null;try{const k=await aes(b64u.dec(r.d.k));const g=await STORE.get('cfg_'+r.d.slot,k);if(!g)return {gone:true};
    let last=g.updated||r.d.created||0;await Promise.all(g.members.map(async m=>{try{const w=await STORE.get('w_'+g.gid+'_'+m.s,k);if(w&&w.updated>last)last=w.updated}catch(e){}}));return {g,last,k}}catch(e){return null}}));
  const box=$('#fams');
  box.innerHTML=rows.length?rows.map((r,i)=>{const d=r.d,x=info[i];if(!d)return `<div class="famrow"><b>Unreadable entry</b> <button class="btn sm danger" data-rmreg="${esc(r.e.id)}">Remove</button></div>`;
    const g=x&&x.g;const home=d.code===HOME;
    return `<div class="famrow"><div class="row" style="justify-content:space-between"><div><b>${esc(d.name||d.code)}</b> <span class="tag blue">${esc(d.code)}</span>${home?' <span class="tag">ours</span>':''}</div></div>
    <div class="small muted" style="margin:4px 0 8px">${g?`Organizer <b>${esc(g.organizer)}</b> · ${g.members.length} people · ${g.assign?'<b>names drawn</b>':'not drawn yet'}`:(x&&x.gone?'<b>No data</b> (deleted or expired)':'Couldn\u2019t load')}<br>Created ${esc(when(d.created))} · Last activity ${esc(when(x&&x.last))}</div>
    <div class="row"><button class="btn sm ghost" data-share="${esc(d.code)}">Copy share link</button>${home?'':`<button class="btn sm danger" data-del="${i}">Delete family…</button>`}</div></div>`}).join(''):'<p class="muted">No families yet.</p>';
  $$('[data-share]',box).forEach(b=>b.onclick=()=>copy(siteUrl()+'#/j/'+b.dataset.share));
  $$('[data-rmreg]',box).forEach(b=>b.onclick=async()=>{if(!confirm('Remove this unreadable registry entry?'))return;await regRemove(b.dataset.rmreg);renderAdmin()});
  $$('[data-del]',box).forEach(b=>b.onclick=async()=>{const r=rows[+b.dataset.del],d=r.d,x=info[+b.dataset.del];
    const t=prompt(`This permanently deletes the "${d.name||d.code}" family: their draw, wishlists, photos and logins. Type the family code (${d.code}) to confirm.`);if(t==null||t.trim().toLowerCase()!==d.code)return;
    b.disabled=true;b.textContent='Deleting…';
    try{if(x&&x.g){const g=x.g,k=x.k;let acc=null;try{acc=await STORE.get('acc_'+g.gid,k)}catch(e){}
        for(const m of g.members){try{const w=await STORE.get('w_'+g.gid+'_'+m.s,k);for(const it of (w&&w.items)||[])if(it.ph)await STORE.set('i_'+g.gid+'_'+it.ph,null)}catch(e){}for(const p of ['w_','r_'])try{await STORE.set(p+g.gid+'_'+m.s,null)}catch(e){}}
        for(const [n,a] of Object.entries((acc&&acc.a)||{})){if(a.h)await dropWrap(d.slot,a.u||n.toLowerCase());if(a.e)await dropEmail(a.e)}
        try{await STORE.set('acc_'+g.gid,null)}catch(e){}}
      await STORE.rawSet('cfg_'+d.slot,null);await regRemove(r.e.id);toast('Deleted '+(d.name||d.code));renderAdmin()}catch(e){toast('Delete failed: '+e.message);b.disabled=false}});
}
route();
})();</script></body></html>
