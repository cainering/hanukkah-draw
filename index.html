function d64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function e64(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function u64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return d64(s)}
/* Storage helpers: localStorage first (persists across tabs, reloads and links), cookie as a backup copy. */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}try{sessionStorage.removeItem(k)}catch(e){}document.cookie=k+'=;path=/;max-age=0;secure;samesite=lax'}
function ckGet(k){var m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):null}
function ckSet(k,v){document.cookie=k+'='+encodeURIComponent(v)+';path=/;max-age=34560000;secure;samesite=lax'}
function remember(key64,cred){lsSet('chd_k',key64);lsSet('chd_c',cred);ckSet('chd_c',cred);try{sessionStorage.removeItem('chd_k')}catch(e){}}
async function derive(u,p){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveBits']);return crypto.subtle.deriveBits({name:'PBKDF2',salt:d64(SALT),iterations:ITERS,hash:'SHA-256'},base,256)}
async function tryKey(raw){var k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(IV)},k,d64(CT));return {k:k,raw:raw,html:new TextDecoder().decode(pt)}}
function launch(r){window.__CHD_KEY=r.k;window.__CHD_RAW=e64(r.raw);var go=function(){document.open();document.write(r.html);document.close()};if(document.readyState==='complete')setTimeout(go,0);else window.addEventListener('load',function(){setTimeout(go,0)})}
var f=document.getElementById('f'),w=document.getElementById('wait');
function showForm(){w.hidden=true;f.hidden=false}
if(!window.crypto||!crypto.subtle){w.textContent='Please open this page in Safari or Chrome (secure connection required).';return}
async function auto(){
  /* 1) saved key bytes (fast path) */
  var saved=lsGet('chd_k')||(function(){try{return sessionStorage.getItem('chd_k')}catch(e){return null}})();
  if(saved){try{return await tryKey(u64(saved))}catch(e){}}
  /* 2) saved login (survives a site update that changes the key) */
  var c=lsGet('chd_c')||ckGet('chd_c');
  if(c){try{var j=JSON.parse(atob(c));var bits=await derive(j.u,j.p);var r=await tryKey(bits);remember(e64(bits),c);return r}catch(e){}}
  return null;
}
auto().then(function(r){if(r)launch(r);else showForm()}).catch(showForm);
f.addEventListener('submit',async function(ev){ev.preventDefault();var btn=document.getElementById('go'),err=document.getElementById('e');err.textContent='';btn.disabled=true;btn.textContent='Checking…';
 try{var u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value;
  var bits=await derive(u,p);var r=await tryKey(bits);var cred=btoa(JSON.stringify({u:u,p:p}));
  if(document.getElementById('r').checked)remember(e64(bits),cred);else{lsDel('chd_k');lsDel('chd_c');try{sessionStorage.setItem('chd_k',e64(bits))}catch(e){}}
  launch(r)}
 catch(x){err.textContent='That username or password didn\u2019t work.';btn.disabled=false;btn.textContent='Sign in'}});
})();
