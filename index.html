var f=document.getElementById('f'),w=document.getElementById('wait');
function showForm(){w.hidden=true;f.hidden=false;document.getElementById('u').focus()}
if(!window.crypto||!crypto.subtle){w.textContent='Please open this page in Safari or Chrome (secure connection required).';return}

 try{var u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value;
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:d64(SALT),iterations:ITERS,hash:'SHA-256'},base,256);
  var r=await tryKey(bits);var store=document.getElementById('r').checked?localStorage:sessionStorage;store.setItem('chd_k',e64(bits));launch(r)}
 catch(x){err.textContent='That username or password didn\u2019t work.';btn.disabled=false;btn.textContent='Sign in'}});
